@if (loading()) {
  <mat-spinner></mat-spinner>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else if (product(); as p) {
  <mat-card class="detail-card">
    <mat-card-header>
      <mat-card-title>{{ p.name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ p.description }}</p>
      <p class="price">{{ p.price | currency }}</p>
      <p class="stock">{{ p.stockQuantity }} in stock</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/customer/catalog">Back to catalog</a>
      @if (user()) {
        <button mat-flat-button color="primary" (click)="addToCart(p)">Add to Cart</button>
      } @else {
        <a mat-button routerLink="/login">Login to add to cart</a>
      }
    </mat-card-actions>
  </mat-card>
}
