<div class="auth-split">
  <div class="auth-brand-panel">
    <div class="brand-lockup">
      <svg class="brand-logo-lg" viewBox="0 0 96 96" fill="none" stroke-linecap="round" aria-hidden="true">
        <path d="M12 62c8-24 20-38 36-38s28 14 36 38" stroke="var(--auth-primary)" stroke-width="6" />
        <path d="M20 74c6-18 15-28 28-28s22 10 28 28" stroke="var(--auth-accent)" stroke-width="5" opacity="0.6" />
      </svg>
      <div class="brand-lockup-text">ShopFlow</div>
      <p class="brand-tagline">Everything you need, one marketplace.</p>
    </div>
  </div>

  <div class="auth-divider"></div>

  <div class="auth-form-panel">
    <div class="auth-form">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to track orders and manage your wishlist.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" formControlName="email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
        </div>

        <div class="row-between">
          <label>
            <input type="checkbox" formControlName="rememberMe" />
            Remember me
          </label>
          <button type="button" class="forgot-link" disabled title="Password reset isn't available yet">
            Forgot password?
          </button>
        </div>

        @if (error()) {
          <p class="errtext">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || status() === 'loading'">
          {{ status() === 'loading' ? 'Signing in…' : 'Login' }}
        </button>
      </form>

      <div class="switch">New to ShopFlow? <a routerLink="/register">Create an account</a></div>
    </div>
  </div>
</div>
