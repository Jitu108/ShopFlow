<div class="auth-split">
  <div class="auth-brand-panel">
    <div class="brand-lockup">
      <svg class="brand-logo-lg" viewBox="0 0 96 96" fill="none" stroke-linecap="round" aria-hidden="true">
        <path d="M12 62c8-24 20-38 36-38s28 14 36 38" stroke="var(--auth-primary)" stroke-width="6" />
        <path d="M20 74c6-18 15-28 28-28s22 10 28 28" stroke="var(--auth-accent)" stroke-width="5" opacity="0.6" />
      </svg>
      <div class="brand-lockup-text">ShopFlow</div>
      <p class="brand-tagline">Everything you need, one marketplace.</p>
    </div>
  </div>

  <div class="auth-divider"></div>

  <div class="auth-form-panel">
    <div class="auth-form">
      <h2>Create your account</h2>
      <p class="sub">Join ShopFlow to shop across independent vendors.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="register-name">Display name</label>
          <input id="register-name" formControlName="displayName" autocomplete="name" />
        </div>

        <div class="field">
          <label for="register-email">Email</label>
          <input id="register-email" type="email" formControlName="email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="register-password">Password</label>
          <input id="register-password" type="password" formControlName="password" autocomplete="new-password" />
          <span class="hint">Min 8 characters, with upper, lower, digit, and special character.</span>
        </div>

        @if (error()) {
          <p class="errtext">{{ error() }}</p>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || status() === 'loading'">
          {{ status() === 'loading' ? 'Creating account…' : 'Register' }}
        </button>
      </form>

      <div class="switch">Already have an account? <a routerLink="/login">Login</a></div>
    </div>
  </div>
</div>
