services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopflow-sqlserver
    environment:
      SA_PASSWORD: ${SQL_SA_PASSWORD}
      ACCEPT_EULA: Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-N", "-C", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shopflow-net

  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - shopflow-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shopflow-net

  # ─── API Gateway ───────────────────────────────────────────────────────────

  gateway:
    build: ./Gateway
    container_name: shopflow-gateway
    ports:
      - "5005:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=ShopFlow
      - JwtSettings__Audience=ShopFlow
      - Cors__AllowedOrigins__0=http://localhost:4200
    depends_on:
      identity-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

  # ─── Microservices ─────────────────────────────────────────────────────────

  identity-service:
    build: ./Services/Identity
    container_name: shopflow-identity
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=ShopFlow
      - JwtSettings__Audience=ShopFlow
      - JwtSettings__ExpiryMinutes=60
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

  product-service:
    build: ./Services/Product
    container_name: shopflow-product
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver;Database=ProductDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=ShopFlow
      - JwtSettings__Audience=ShopFlow
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

  order-service:
    build:
      context: .
      dockerfile: Services/Order/Dockerfile
    container_name: shopflow-order
    ports:
      - "5003:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver;Database=OrderDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=ShopFlow
      - JwtSettings__Audience=ShopFlow
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

  cart-service:
    build:
      context: .
      dockerfile: Services/Cart/Dockerfile
    container_name: shopflow-cart
    ports:
      - "5004:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=ShopFlow
      - JwtSettings__Audience=ShopFlow
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

  notification-service:
    build:
      context: .
      dockerfile: Services/Notification/Dockerfile
    container_name: shopflow-notification
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Pass=${RABBITMQ_PASS}
      - SMTP_HOST=smtp4dev
      - SMTP_PORT=25
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

  # Dev-only SMTP catcher — Notification's real .env.example SMTP_* values are for a
  # production provider; this local server lets the confirmation email be observed
  # (web UI + REST API) without sending anywhere real.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: shopflow-smtp4dev
    ports:
      - "5099:80"
    networks:
      - shopflow-net

  # ─── Frontend ──────────────────────────────────────────────────────────────

  angular-ui:
    build: ./ClientApp
    container_name: shopflow-ui
    ports:
      - "4200:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - shopflow-net

# ─── Volumes & Networks ──────────────────────────────────────────────────────

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:

networks:
  shopflow-net:
    driver: bridge
